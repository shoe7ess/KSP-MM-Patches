// ============================================================================
// SELECTIVE B9 PARTSWITCH TANK CONFIG FOR ALL CREW CABINS & PODS (ALL MODS)
// ============================================================================
@PART[*]:HAS[#CrewCapacity[>0],!MODULE[ModuleB9PartSwitch]:HAS[#moduleID[*LifeSupport*|*USI*|*cargo*|*tankSwitch*]]]:NEEDS[B9PartSwitch,USILifeSupport]:FINAL
{
    !RESOURCE[Supplies] {}
    !RESOURCE[Mulch] {}
    !RESOURCE[Fertilizer] {}

    // 2. Setup the dynamic B9 Resource Switcher module
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = UniversalUSILSTankSwitch
        switcherDescription = Life Support Tank
        switcherDescriptionPlural = Life Support Tanks
        baseVolume = #$/mass$
        @baseVolume *= 200 // Establishes tank volume proportional to craft weight

        // SUBTYPE 1: Pure Snack Storage
        SUBTYPE
        {
            name = USI_Supplies
            title = Supplies (Snacks)
            descriptionSummary = Maximizes crew food storage for short-to-medium trips.
            tankType = USI_Supplies_Type
        }

        // SUBTYPE 2: Greenhouse Recycler Fuel
        SUBTYPE
        {
            name = USI_Fertilizer
            title = Fertilizer
            descriptionSummary = Maximizes greenhouse enrichment storage for long-term orbital stations.
            tankType = USI_Fertilizer_Type
        }

        // SUBTYPE 3: Balanced Mission Payload
        SUBTYPE
        {
            name = USI_Combo
            title = LS Combo
            descriptionSummary = A balanced mix of Supplies, empty space for Mulch waste, and Fertilizer.
            tankType = USI_Combo_Type
        }
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch,USILifeSupport]
{
    name = USI_Supplies_Type
    tankMass = 0.0001
    RESOURCE
    {
        name = Supplies
        unitsPerVolume = 1.0
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch,USILifeSupport]
{
    name = USI_Fertilizer_Type
    tankMass = 0.0001
    RESOURCE
    {
        name = Fertilizer
        unitsPerVolume = 1.0
    }
}

B9_TANK_TYPE:NEEDS[B9PartSwitch,USILifeSupport]
{
    name = USI_Combo_Type
    tankMass = 0.0001
    RESOURCE
    {
        name = Supplies
        unitsPerVolume = 0.7
    }
    RESOURCE
    {
        name = Fertilizer
        unitsPerVolume = 0.2
    }
    RESOURCE
    {
        name = Mulch
        unitsPerVolume = 0.1
        percentFilled = 0
    }
}
