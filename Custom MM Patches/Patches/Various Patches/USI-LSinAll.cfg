@PART[*]:HAS[@MODULE[ModuleCommand],#CrewCapacity[>0],!MODULE[ModuleLifeSupport]]:NEEDS[USILifeSupport]:FINAL
{
    %MODULE[ModuleLifeSupport] {}

    // Formulation
    %RESOURCE[Supplies]
    {
        amount = #$/mass$
        @amount *= 100
        maxAmount = #$amount$
    }

    %RESOURCE[Mulch]
    {
        amount = 0
        maxAmount = #$/RESOURCE[Supplies]/maxAmount$
        @maxAmount *= 0.1
    }
    %RESOURCE[Fertilizer]
    {
        amount = #$/mass$
        @amount *= 10
        maxAmount = #$amount$
    }
}