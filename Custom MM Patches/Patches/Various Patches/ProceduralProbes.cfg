+PART[proceduralBattery]:FIRST
{
    @name = proceduralProbeCore
    @title = Procedural Probe Cores
    @description = A procedurally scalable probe core. Storage capacity, power draw, and transmission costs adjust natively based on the size you build it, while antenna power and capabilities scale through career tech progression.
    @category = Control
    
    !MODULE[TankContentSwitcher] {}

    MODULE
    {
        name = TankContentSwitcher
        useVolume = True
        TANK_TYPE_OPTION
        {
            name = ElectricCharge
            dryDensity = 0.2
            RESOURCE
            {
                name = ElectricCharge
                unitsPerKL = 20000        // Scaled storage based on part volume
            }
        }
    }

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05                 // Class 1 Background Drain
        }
        hasBaseCommandFromPlatform = True
    }
    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 1
    }
    !MODULE[ModuleDataTransmitter] {}
    MODULE
    {
        name = ModuleProceduralDataTransmitter
        antennaType = RELAY
        antennaCombinable = True
        antennaPower = 500000            // Class 1: 500k Power (longAntenna equivalent)
        
        packetResourceCost = 12.0
        @packetResourceCost *= #$/MODULE[ProceduralPart]/volume$ 
    }

    @MODULE[ProceduralPart]
    {
        @length = 0.25
        @diameter = 1.25
        
        %techConstraints
        {
            // Class 2
            TECHBOUNDS
            {
                techNode = flightControl
                maxDiameter = 2.5
                maxLength = 2.0
            }
            // Class 3
            TECHBOUNDS
            {
                techNode = advExploration
                maxDiameter = 3.75
                maxLength = 4.0
            }
            // Class 4
            TECHBOUNDS
            {
                techNode = largeUnmanned
                maxDiameter = 5.0
                maxLength = 8.0
            }
            // Class 5
            TECHBOUNDS
            {
                techNode = automation
                maxDiameter = Unlimited
                maxLength = Unlimited
            }
        }
    }
}

// Define the Upgrade items visible in the Tech Tree
PARTUPGRADE
{
    name = ProcProbeClass2
    partIcon = proceduralProbeCore
    techRequired = flightControl
    title = Procedural Probe Core Upgrade: Class 2
    description = Upgrades the integrated transceivers and processing stability of the Procedural Probe Core.
}

PARTUPGRADE
{
    name = ProcProbeClass3
    partIcon = proceduralProbeCore
    techRequired = advExploration
    title = Procedural Probe Core Upgrade: Class 3
    description = Upgrades the integrated transceivers and processing stability of the Procedural Probe Core.
}

PARTUPGRADE
{
    name = ProcProbeClass4
    partIcon = proceduralProbeCore
    techRequired = largeUnmanned
    title = Procedural Probe Core Upgrade: Class 4
    description = Upgrades the integrated transceivers and processing stability of the Procedural Probe Core.
}

PARTUPGRADE
{
    name = ProcProbeClass5
    partIcon = proceduralProbeCore
    techRequired = automation
    title = Procedural Probe Core Upgrade: Class 5
    description = Upgrades the integrated transceivers and processing stability of the Procedural Probe Core.
}

// Inject Upgrade handlers into the part config
@PART[proceduralProbeCore]:FOR[ProceduralParts]
{
    MODULE
    {
        name = PartUpgradeHandler
        UPGRADE
        {
            name__ = ProcProbeClass2
            techRequired__ = flightControl
            
            MODULE
            {
                name = ModuleProceduralDataTransmitter
                antennaPower = 2000000 // 2M
            }
            MODULE
            {
                name = ModuleCommand
                RESOURCE
                {
                    name = ElectricCharge
                    rate = 0.08
                }
            }
            MODULE
            {
                name = ModuleSAS
                SASServiceLevel = 2
            }
        }
    }

    MODULE
    {
        name = PartUpgradeHandler
        UPGRADE
        {
            name__ = ProcProbeClass3
            techRequired__ = advExploration
            
            MODULE
            {
                name = ModuleProceduralDataTransmitter
                antennaPower = 5000000000 // 5G
            }
            MODULE
            {
                name = ModuleCommand
                RESOURCE
                {
                    name = ElectricCharge
                    rate = 0.12
                }
            }
        }
    }

    MODULE
    {
        name = PartUpgradeHandler
        UPGRADE
        {
            name__ = ProcProbeClass4
            techRequired__ = largeUnmanned
            
            MODULE
            {
                name = ModuleProceduralDataTransmitter
                antennaPower = 50000000000 // 50G
            }
            MODULE
            {
                name = ModuleCommand
                RESOURCE
                {
                    name = ElectricCharge
                    rate = 0.20
                }
            }
            MODULE
            {
                name = ModuleSAS
                SASServiceLevel = 3
            }
        }
    }

    MODULE
    {
        name = PartUpgradeHandler
        UPGRADE
        {
            name__ = ProcProbeClass5
            techRequired__ = automation
            
            MODULE
            {
                name = ModuleProceduralDataTransmitter
                antennaPower = 100000000000 // 100G
            }
            MODULE
            {
                name = ModuleCommand
                RESOURCE
                {
                    name = ElectricCharge
                    rate = 0.25
                }
            }
        }
    }

// RemoteTech2 Configs
@PART[proceduralProbeCore]:NEEDS[RemoteTech]:FINAL
{
    @description = A procedurally scalable probe core. Features a built-in RemoteTech Flight Computer (SPU) and an integrated Omni/Relay transceiver system that scales in performance via career technology choices.

    !MODULE[ModuleDataTransmitter] {}
    !MODULE[ModuleProceduralDataTransmitter] {}

    MODULE
    {
        name = ModuleSPU
        IsRTCommandStation = False
    }

    MODULE
    {
        name = ModuleRTAntenna
        Mode0OmniRange = 0              // Range when deactivated (0 km)
        Mode1OmniRange = 500000         // Class 1 Range: 500 km (longAntenna range)
        EnergyCost = 0.02               // Power draw to keep transceiver active
        
        DeployFxModules = 0
        TRANSMITTER
        {
            PacketInterval = 0.3
            PacketSize = 2
            PacketResourceCost = 15.0   // Baseline calculation multiplier
        }
    }
}

// Class 2 Upgrade (Flight Control)
@PART[proceduralProbeCore]:HAS[@MODULE[ModuleSPU]]:NEEDS[RemoteTech]:FOR[ProceduralParts]
{
    @MODULE[ModuleRTAntenna]:NEEDS[FlightControl]
    {
        @Mode1OmniRange = 2000000       // Class 2: 2,000 km (2 Mm)
        @EnergyCost = 0.05
    }
}

// Class 3 Upgrade (Advanced Exploration)
@PART[proceduralProbeCore]:HAS[@MODULE[ModuleSPU]]:NEEDS[RemoteTech]:FOR[ProceduralParts]
{
    @MODULE[ModuleRTAntenna]:NEEDS[AdvExploration]
    {
        // Transceiver mutates into a long-range narrow Dish at Class 3
        @Mode1OmniRange = 0             // Drop omni behaviors
        %Mode1DishRange = 5000000000    // Class 3: 5,000,000 km (5 Gm Interplanetary Dish)
        %DishAngle = 25.0               // Beam width targeting cone
        @EnergyCost = 0.10
    }
}

// Class 4 Upgrade (Large Unmanned Systems)
@PART[proceduralProbeCore]:HAS[@MODULE[ModuleSPU]]:NEEDS[RemoteTech]:FOR[ProceduralParts]
{
    @MODULE[ModuleRTAntenna]:NEEDS[LargeUnmanned]
    {
        @Mode1DishRange = 50000000000   // Class 4: 50,000,000 km (50 Gm Deep Space Dish)
        @DishAngle = 10.0               // Narrower, highly focused tracking beam
        @EnergyCost = 0.18
    }
}

// Class 5 Upgrade (Automation)
@PART[proceduralProbeCore]:HAS[@MODULE[ModuleSPU]]:NEEDS[RemoteTech]:FOR[ProceduralParts]
{
    @MODULE[ModuleRTAntenna]:NEEDS[Automation]
    {
        @Mode1DishRange = 100000000000  // Class 5: 100,000,000 km (100 Gm Outer Planets Dish)
        @DishAngle = 5.0                // Pinpoint solar-system-wide precision beam
        @EnergyCost = 0.25
    }
}
