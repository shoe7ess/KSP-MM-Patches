@PART[*]:HAS[@MODULE[ModuleCommand],#vesselType[Probe],!MODULE[ModuleSPU]]:NEEDS[RemoteTech]:FOR[RemoteTech]
{
    %description = #$description$ \n\n<color=yellow>RemoteTech Enabled:</color> Features an integrated Signal Processing Unit (SPU) and an internal emergency omni-antenna array.

    // 1. Inject the Signal Processing Unit (Flight Computer)
    MODULE
    {
        name = ModuleSPU
        IsRTCommandStation = False
    }

    // 2. Inject a standard fallback Omni Antenna
    // This prevents probes from becoming instantly bricked upon launch 
    // if a physical antenna wasn't attached.
    MODULE
    {
        name = ModuleRTAntenna
        Mode0OmniRange = 0                  // Range when retracted/inactive (0 meters)
        Mode1OmniRange = 3000               // Short range emergency connection (3 km)
        EnergyCost = 0.01                   // Very minimal power consumption
        
        DeployFxModules = 0
        
        TRANSMITTER
        {
            PacketInterval = 0.3
            PacketSize = 2
            PacketResourceCost = 15.0
        }
    }
}