// Scales up RemoteTech Omni antennas by 5x (e.g., Comms 32 goes from 5Mm to 25Mm)
@PART[*]:HAS[@MODULE[ModuleRTAntennaPassive]]:NEEDS[RemoteTech,OPM]:FINAL
{
    @MODULE[ModuleRTAntennaPassive]
    {
        @OmniRange *= 5.0
    }
}

// Scales up RemoteTech Active Dish and Omni antennas proportionally by 5x
// This pushes high-tier stock/RT dishes (like the 250 Gm GX-128 or 400 Gm JX2) into the 1,000 Gm+ range.
@PART[*]:HAS[@MODULE[ModuleRTAntenna]]:NEEDS[RemoteTech,OPM]:FINAL
{
    @MODULE[ModuleRTAntenna]
    {
        // Multiply both Mode1 (deployed) and Mode0 (retracted/omni fallback) ranges
        @Mode1DishRange *= 5.0
        @Mode1OmniRange *= 5.0
        @Mode0OmniRange *= 5.0
    }
}